<script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const response = await fetch('get_user_pets.php');
      const data = await response.json();

      const grid = document.getElementById('petCardsGrid');
      if (!grid) return;

      grid.innerHTML = ''; // Clear loading text

      if (!data.pets || data.pets.length === 0) {
        grid.innerHTML = `<p style="color: #64748b; grid-column: 1/-1;">No pets registered yet. Click "+ Register New Pet" above!</p>`;
        return;
      }

      // Dynamically render pet cards
      data.pets.forEach(pet => {
        const card = document.createElement('div');
        card.className = 'pet-detail-card';
        card.innerHTML = `
          <div class="pet-card-top">
            <div class="pet-avatar-lg"><span class="material-symbols-outlined">pets</span></div>
            <div class="pet-card-meta">
              <h3>${pet.name}</h3>
              <span class="pet-species-badge">${pet.species || 'Pet'}</span>
            </div>
          </div>
          <ul class="pet-info-list">
            <li><strong>Breed:</strong> ${pet.breed || 'N/A'}</li>
            <li><strong>Gender:</strong> ${pet.gender || 'N/A'}</li>
            <li><strong>Age:</strong> ${pet.age || 'N/A'}</li>
            <li><strong>Notes:</strong> ${pet.notes || 'No special notes recorded.'}</li>
          </ul>
          <div class="pet-card-actions">
            <a href="book_service.html?pet_id=${pet.id}" class="dash-pet-action" style="font-size: 13px;">Book Service for ${pet.name} →</a>
          </div>
        `;
        grid.appendChild(card);
      });
    } catch (err) {
      console.error('Error fetching pets:', err);
      const grid = document.getElementById('petCardsGrid');
      if (grid) grid.innerHTML = `<p style="color: #ef4444; grid-column: 1/-1;">Unable to load pets right now.</p>`;
    }
  });

  function toggleProfileMenu() {
    const menu = document.getElementById('profileMenu');
    if (menu) menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
  }

  window.addEventListener('click', (e) => {
    if (!e.target.closest('.profile-dropdown-wrap')) {
      const menu = document.getElementById('profileMenu');
      if (menu) menu.style.display = 'none';
    }
  });
</script>
